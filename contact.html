<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="page-head"><div class="container">
      <h1>Contact and directions</h1>
      <p>The quickest way to reach the restaurant is by phone.</p>
    </div></div>
    <section class="section">
      <div class="container split">
        <div>
          <h2>Visit or call</h2>
          <address><span data-bind="address.street"></span><br><span data-bind="address.city"></span>, <span data-bind="address.province"></span> <span data-bind="address.postalCode"></span><br><span data-bind="address.country"></span></address>
          <p><strong>Phone:</strong> <a data-tel href="#"></a></p>
          <p class="note">Map reference: <span data-bind="mapPlusCode"></span></p>
          <div class="button-row">
            <a class="btn btn-red" href="#" data-action="call">Call Now</a>
            <a class="btn btn-red" href="#" data-action="directions">Get Directions</a>
            <a class="btn btn-line-dark" href="#" data-action="order">Order Online</a>
          </div>
          <p class="note gap-top">An email address has not been confirmed, so please phone the restaurant.</p>
        </div>
        <div id="hours">
          <h2>Hours</h2>
          <div data-render="hours"></div>
        </div>
      </div>
    </section>
    <section class="section section-alt">
      <div class="container">
        <h2>Good to know before you visit</h2>
        <div class="know" data-render="goodToKnow"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
