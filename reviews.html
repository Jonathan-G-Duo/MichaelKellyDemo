<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Reviews | Michael Kelly's Bar &amp; Grill, Whitby</title>
  <meta name="description" content="See how customers rate Michael Kelly's Bar &amp; Grill in Whitby, Ontario, and where to read their reviews.">
  <!-- DEMO: remove the next line when the real site goes live -->
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reviews | Michael Kelly's Bar &amp; Grill, Whitby">
  <meta property="og:description" content="See how customers rate Michael Kelly's Bar &amp; Grill in Whitby, Ontario, and where to read their reviews.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32.png">
  <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="data/business.js" defer></script>
  <script src="data/menu.js" defer></script>
  <script src="data/gallery.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="page-head"><div class="container">
      <h1>Reviews</h1>
      <p>What customers say, in their own words on Google.</p>
    </div></div>
    <section class="section">
      <div class="container">
        <div class="rating">
          <span class="rating-num" data-bind="rating.value"></span>
          <span>out of 5 from <strong data-bind="rating.count"></strong> <span data-bind="rating.source"></span> reviews</span>
        </div>
        <p class="note">Ratings are customer opinions from Google. They change over time and are not statements from the restaurant.</p>
        <div data-render="reviews"></div>
        <div class="button-row">
          <a class="btn btn-red" href="#" data-action="reviews">Read Reviews on Google Maps</a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <noscript><p class="noscript-msg">This site needs JavaScript to show restaurant details. Please enable it, or contact the restaurant directly.</p></noscript>
</body>
</html>
